# ChirpStack v4 de la practica L10 (Anexo C de la guia). Configuracion minima: los
# planes US915 de las sub-bandas 1 y 2 y la salida MQTT hacia el broker del
# laboratorio (192.168.1.50, el de la Practica L9). Plantilla: chirpstack-docker.
[logging]
  level="info"

[postgresql]
  dsn="postgres://chirpstack:chirpstack@$POSTGRESQL_HOST/chirpstack?sslmode=disable"
  max_open_connections=10
  min_idle_connections=0

[redis]
  servers=["redis://$REDIS_HOST/"]
  tls_enabled=false
  cluster=false

[network]
  net_id="000000"
  # us915_1 = sub-banda 2 (canales 8-15 + 65), la del banco; us915_0 = sub-banda 1 (Paso 7)
  enabled_regions=["us915_0", "us915_1"]

[api]
  bind="0.0.0.0:8080"
  secret="banco-ucuenca-l10-cambie-este-secreto"

[integration]
  enabled=["mqtt"]
  [integration.mqtt]
    server="tcp://$MQTT_BROKER_HOST:1883/"
    json=true
