# Practica L10 - servidor de red propio (ChirpStack v4, Anexo C de la guia) en TU Docker,
# enchufado al segmento del banco (tab_lan) como el PC de la Practica L9.
#
#   pasarela LoRaWAN del laboratorio 192.168.1.70 --UDP 1700--> gateway bridge 192.168.1.80
#   gateway bridge --MQTT--> broker del laboratorio 192.168.1.50 <--MQTT-- chirpstack (.81)
#
# Desde esta carpeta, en TU computador:
#   docker compose -p l10 up -d              ->  http://localhost:8089  (admin / admin)
#   docker compose -p l10 logs -f chirpstack-gateway-bridge
#   docker compose -p l10 down               (al terminar; -v borra tambien la base de datos)
#
# Paso 7 (fallo provocado): la region la fija el prefijo de los temas del bridge.
#   PowerShell:  $env:REGION="us915_0"; docker compose -p l10 up -d chirpstack-gateway-bridge
#   y para volver: $env:REGION="us915_1"; docker compose -p l10 up -d chirpstack-gateway-bridge
services:
  chirpstack:
    image: chirpstack/chirpstack:4
    container_name: l10-chirpstack
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes: ["./configuration/chirpstack:/etc/chirpstack"]
    depends_on: [postgres, redis]
    environment: [MQTT_BROKER_HOST=192.168.1.50, REDIS_HOST=redis, POSTGRESQL_HOST=postgres]
    ports: ["127.0.0.1:8089:8080"]
    networks:
      l10: {}
      tab_lan: {ipv4_address: 192.168.1.81}

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    container_name: l10-gateway-bridge
    restart: unless-stopped
    volumes: ["./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge"]
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=${REGION:-us915_1}/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=${REGION:-us915_1}/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=${REGION:-us915_1}/gateway/{{ .GatewayID }}/command/#
    networks:
      tab_lan: {ipv4_address: 192.168.1.80}

  postgres:
    image: postgres:14-alpine
    container_name: l10-postgres
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - postgresqldata:/var/lib/postgresql/data
    environment: [POSTGRES_USER=chirpstack, POSTGRES_PASSWORD=chirpstack, POSTGRES_DB=chirpstack]
    networks: [l10]

  redis:
    image: redis:7-alpine
    container_name: l10-redis
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes: ["redisdata:/data"]
    networks: [l10]

volumes:
  postgresqldata:
  redisdata:
networks:
  l10: {}
  tab_lan: {external: true}
