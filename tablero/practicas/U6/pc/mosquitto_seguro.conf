# Taller U6 - Parte IV: broker Mosquitto ENDURECIDO. Sustituye al de la Practica L9, que
# dejaba "allow_anonymous true" a proposito. Cada directiva mapea a un Foundational
# Requirement de la IEC 62443-3-3. Los secretos (pwfile, cert) NO van aqui ni en el
# repositorio: los genera arranque_broker.sh dentro del contenedor.
persistence false

# FR1 (SR 1.2) - identificacion y autenticacion: se acabo el anonimo de la Practica L9
allow_anonymous false
password_file /mosquitto/config/pwfile

# FR2 (SR 2.1) - control de uso: autorizacion por rol (el lector no escribe mandos)
acl_file /mosquitto/config/acl

# FR4 (SR 4.1) - confidencialidad: TLS en el 8883 (el 1883 en claro desaparece)
listener 8883
cafile /mosquitto/config/server.crt
certfile /mosquitto/config/server.crt
keyfile /mosquitto/config/server.key

# FR6 (SR 6.1) - respuesta a eventos: registro de conexiones, autenticacion y ACL
log_type all
log_timestamp true
connection_messages true
